#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path></svg><span class="">Google</span></button><button aria-label="Continue with DigiLocker or Aadhaar ID" class="flex items-center justify-center gap-space-sm px-space-md py-space-sm rounded-lg bg-surface-container-low hover:bg-surface-container transition-all duration-200 text-on-surface font-label-md text-label-md shadow-sm active:scale-[0.99]" type="button"><span class="material-symbols-outlined text-secondary text-[20px]">badge</span><span class="">DigiLocker / Aadhaar</span></button></div><div class="relative flex items-center justify-center my-space-xs"><div class="w-full h-[1px] bg-surface-container-high"></div><span class="absolute bg-surface-container-lowest px-space-md font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">or sign in with email</span></div><form class="flex flex-col gap-space-md" id="signinForm" onsubmit="handleSignIn(event)"><div class="flex flex-col gap-space-xs"><label class="font-label-md text-label-md text-on-surface flex justify-between items-center" for="email"><span class="">Email address</span><span class="text-on-surface-variant font-label-sm text-label-sm font-normal">Primary ID</span></label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-space-md text-on-surface-variant text-[20px]">mail</span><input class="w-full h-12 pl-11 pr-space-md rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-on-tertiary-container transition-all duration-200" id="email" placeholder="aarav@example.com" required="" type="email"></div></div><div class="flex flex-col gap-space-xs"><div class="flex justify-between items-center"><label class="font-label-md text-label-md text-on-surface" for="password">Password</label><a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors font-semibold" href="#">Forgot password?</a></div><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-space-md text-on-surface-variant text-[20px]">lock</span><input class="w-full h-12 pl-11 pr-11 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-on-tertiary-container transition-all duration-200" id="password" placeholder="Enter your security token" required="" type="password"><button aria-label="Toggle password visibility" class="absolute right-space-md text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center p-1" id="togglePassword" type="button"><span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span></button></div></div><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-space-sm pt-space-xs"><label class="flex items-center gap-space-sm cursor-pointer select-none"><input checked="" class="w-4 h-4 rounded text-primary focus:ring-0 accent-primary cursor-pointer" type="checkbox"><span class="font-body-sm text-body-sm text-on-surface">Remember me on this device</span></label></div><button class="w-full h-12 rounded-lg bg-primary hover:bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-sm shadow-md hover:shadow-lg transition-all duration-200 active:scale-[0.99] mt-space-xs" type="submit"><span class="">Sign In to Dashboard</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button></form></div><div class="flex flex-col gap-space-md mt-space-lg pt-space-md"><p class="text-center font-body-sm text-body-sm text-on-surface-variant">Don't have an account? <a class="font-label-md text-label-md text-secondary hover:underline font-semibold ml-1" href="/register">Sign up for free</a></p><div class="flex items-center justify-center gap-space-sm text-center font-label-sm text-label-sm text-on-surface-variant"></div></div></div></div></div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    
    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();

  async function handleSignIn(e) {
    e.preventDefault();
    const emailInput = document.getElementById('email').value.trim().toLowerCase();
    const passwordInput = document.getElementById('password').value;

    if (!emailInput || !passwordInput) {
      alert('Please enter both your email address and password.');
      return;
    }

    // Retrieve users dictionary from localStorage
    let usersDict = {};
    try {
      const stored = localStorage.getItem('v2s_users');
      if (stored) usersDict = JSON.parse(stored);
    } catch (err) { usersDict = {}; }

    // Check JS dictionary for credentials
    if (usersDict[emailInput]) {
      const userObj = usersDict[emailInput];
      if (userObj.password === passwordInput) {
        localStorage.setItem('v2s_user', JSON.stringify(userObj));
        localStorage.setItem('v2s_current_user', JSON.stringify(userObj));
        window.location.href = '/dashboard';
        return;
      } else {
        alert('Incorrect password! Please check your credentials.');
        return;
      }
    }

    // API Fallback
    try {
      const response = await fetch('/api/signin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailInput, password: passwordInput })
      });
      const data = await response.json();
      if (data.status === 'success') {
        const fallbackUser = data.user;
        fallbackUser.password = passwordInput;
        usersDict[emailInput] = fallbackUser;
        localStorage.setItem('v2s_users', JSON.stringify(usersDict));
        localStorage.setItem('v2s_user', JSON.stringify(fallbackUser));
        localStorage.setItem('v2s_current_user', JSON.stringify(fallbackUser));
        window.location.href = '/dashboard';
        return;
      }
    } catch (err) {}

    alert('User account not found. Please register first.');
  }
</script></main><footer class="w-full py-space-md text-center bg-surface-container-lowest text-on-surface-variant font-label-sm text-label-sm">© 2025 Voice2Sign. Accessible AI Sign Education.</footer>
